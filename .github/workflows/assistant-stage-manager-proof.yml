name: Assistant desktop proof

on:
  push:
    branches: [assistant-stage-manager-proof]

permissions:
  contents: read

concurrency:
  group: assistant-desktop-proof
  cancel-in-progress: false

jobs:
  desktop-proof:
    runs-on: xcode-27
    env:
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Compile desktop capability probe
        run: |
          mkdir -p evidence
          xcrun clang++ -std=c++17 -fobjc-arc -framework AppKit -framework ApplicationServices -framework ImageIO packages/macos-panel/tests/desktopProbe.mm -o evidence/desktop-probe
      - name: Inspect isolated desktop
        run: |
          test "$(uname -m)" = arm64
          evidence/desktop-probe capabilities > evidence/capabilities.json
          defaults read com.apple.WindowManager > evidence/window-manager-preferences.txt 2>&1 || true
          osascript -e 'tell application "System Events" to return UI elements enabled' > evidence/automation.txt 2>&1
          osascript -e 'tell application "System Events" to tell process "ControlCenter" to return properties of every menu bar item of menu bar 1' > evidence/control-center.txt 2>&1 || true
          evidence/desktop-probe ax-tree-all > evidence/desktop-accessibility.json
          screencapture -x evidence/desktop.png
      - name: Inspect Stage Manager control
        run: |
          evidence/desktop-probe ax-press-all "Control Center"
          sleep 1
          evidence/desktop-probe ax-tree com.apple.controlcenter > evidence/control-center-open.json
          evidence/desktop-probe ax-press com.apple.controlcenter "Stage Manager" || true
          sleep 1
          evidence/desktop-probe ax-tree com.apple.controlcenter > evidence/stage-manager-control.json
          screencapture -x evidence/stage-manager-control.png
          evidence/desktop-probe ax-press-all "com.apple.menuextra.controlcenter"
          evidence/desktop-probe ax-tree com.apple.WindowManager > evidence/stage-manager-intro.json
          evidence/desktop-probe ax-tree-all > evidence/intro-all-apps.json
          evidence/desktop-probe snapshot > evidence/intro-windows.json
          evidence/desktop-probe ax-press com.apple.WindowManager "Turn On Stage Manager" || evidence/desktop-probe click 720 645
          sleep 1
          evidence/desktop-probe click 720 645
          screencapture -x evidence/stage-manager-enabled.png
          sleep 2
          defaults read com.apple.WindowManager > evidence/window-manager-after.txt 2>&1 || true
      - name: Download signed comparison application
        run: |
          mkdir -p "$RUNNER_TEMP/cherry-control" evidence/actual
          gh release view v2.1.6 --repo "$GITHUB_REPOSITORY" --json assets > evidence/actual/assets.json
          gh release download v2.1.6 --repo "$GITHUB_REPOSITORY" --pattern '*-mac-arm64.zip' --dir "$RUNNER_TEMP/cherry-control"
          python3 - "$RUNNER_TEMP/cherry-control" <<'PYTHON'
          import hashlib, json, pathlib, subprocess, sys
          directory = pathlib.Path(sys.argv[1])
          archive = next(directory.glob('*.zip'))
          assets = json.loads(pathlib.Path('evidence/actual/assets.json').read_text())['assets']
          asset = next(item for item in assets if item['name'] == archive.name)
          with archive.open('rb') as stream:
              digest = 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
          assert digest == asset['digest'], 'Published checksum mismatch'
          subprocess.run(['ditto', '-x', '-k', str(archive), str(directory)], check=True)
          subprocess.run(['codesign', '--verify', '--deep', '--strict', str(directory / 'Cherry Studio.app')], check=True)
          PYTHON
      - uses: ./.github/actions/setup-validation
        id: dependencies
      - name: Compare fresh native candidates
        continue-on-error: true
        run: |
          node native/darwin/build.js arm64
          xcrun clang++ -std=c++17 -fobjc-arc -shared -undefined dynamic_lookup -framework AppKit -I "$(node -p 'require("node:path").resolve(process.execPath, "../../include/node")')" packages/macos-panel/tests/candidateOptions.mm -o evidence/candidateOptions.node
          failed=0
          for candidate in baseline prevents-activation join-all-applications; do
            mkdir -p "evidence/$candidate"
            cp evidence/desktop-probe evidence/candidateOptions.node "evidence/$candidate/"
            pnpm exec electron packages/macos-panel/tests/desktopProof.cjs "evidence/$candidate" "$candidate" || failed=1
          done
          exit "$failed"
      - name: Run actual Cherry toolbar comparison
        run: |
          xcrun clang++ -std=c++17 -fobjc-arc -shared -undefined dynamic_lookup -framework AppKit -I "$(node -p 'require("node:path").resolve(process.execPath, "../../include/node")')" packages/macos-panel/tests/activationTrace.mm -o evidence/actual/activationTrace.node
          cp evidence/desktop-probe evidence/actual/desktop-probe
          node packages/macos-panel/tests/cherryDesktopProof.cjs "$RUNNER_TEMP/cherry-control/Cherry Studio.app" evidence/actual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: assistant-desktop-proof-${{ github.sha }}
          path: |
            evidence/*.json
            evidence/*.txt
            evidence/*.png
            evidence/actual/*.json
            evidence/actual/*.jsonl
            evidence/actual/*.log
            evidence/actual/*.png
            evidence/actual/*.ips
            evidence/actual/*.crash
            evidence/baseline/*.json
            evidence/baseline/*.png
            evidence/prevents-activation/*.json
            evidence/prevents-activation/*.png
            evidence/join-all-applications/*.json
            evidence/join-all-applications/*.png
          if-no-files-found: error
          retention-days: 14

  release-startup:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2.1.6
    steps:
      - uses: actions/checkout@v7
      - name: Download published arm64 release
        run: |
          mkdir -p evidence/release
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > evidence/release/assets.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-mac-arm64.zip' --dir evidence/release
      - name: Verify and smoke test packaged startup
        run: python3 packages/macos-panel/tests/releaseSmoke.py evidence/release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-startup-${{ github.sha }}
          path: |
            evidence/release/*.json
            evidence/release/*.log
            evidence/release/*.png
          if-no-files-found: error
          retention-days: 14
