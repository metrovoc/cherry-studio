name: Assistant desktop proof

on:
  push:
    branches: [assistant-stage-manager-proof]

permissions:
  contents: read

concurrency:
  group: assistant-desktop-proof
  cancel-in-progress: false

jobs:
  desktop-proof:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Compile desktop capability probe
        run: |
          mkdir -p evidence
          xcrun clang++ -std=c++17 -fobjc-arc -framework AppKit -framework ApplicationServices -framework ImageIO packages/macos-panel/tests/desktopProbe.mm -o evidence/desktop-probe
      - name: Inspect isolated desktop
        run: |
          test "$(uname -m)" = arm64
          evidence/desktop-probe capabilities > evidence/capabilities.json
          defaults read com.apple.WindowManager > evidence/window-manager-preferences.txt 2>&1 || true
          osascript -e 'tell application "System Events" to return UI elements enabled' > evidence/automation.txt 2>&1
          osascript -e 'tell application "System Events" to tell process "ControlCenter" to return properties of every menu bar item of menu bar 1' > evidence/control-center.txt 2>&1
          screencapture -x evidence/desktop.png
      - name: Inspect Stage Manager control
        run: |
          evidence/desktop-probe ax-press com.apple.controlcenter "Control Center"
          sleep 1
          evidence/desktop-probe ax-tree com.apple.controlcenter > evidence/control-center-open.json
          evidence/desktop-probe ax-press com.apple.controlcenter "Stage Manager" || true
          sleep 1
          evidence/desktop-probe ax-tree com.apple.controlcenter > evidence/stage-manager-control.json
          screencapture -x evidence/stage-manager-control.png
          evidence/desktop-probe ax-press com.apple.controlcenter "com.apple.menuextra.controlcenter"
          evidence/desktop-probe ax-tree com.apple.WindowManager > evidence/stage-manager-intro.json
          evidence/desktop-probe ax-tree-all > evidence/intro-all-apps.json
          evidence/desktop-probe snapshot > evidence/intro-windows.json
          evidence/desktop-probe ax-press com.apple.WindowManager "Turn On Stage Manager" || evidence/desktop-probe click 720 645
          sleep 1
          evidence/desktop-probe click 720 645
          screencapture -x evidence/stage-manager-enabled.png
          sleep 2
          defaults read com.apple.WindowManager > evidence/window-manager-after.txt 2>&1 || true
      - uses: ./.github/actions/setup-validation
      - name: Run real desktop toolbar comparison
        run: pnpm exec electron packages/macos-panel/tests/desktopProof.cjs evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: assistant-desktop-proof-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  release-startup:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2.1.7
    steps:
      - uses: actions/checkout@v7
      - name: Download published arm64 release
        run: |
          mkdir -p evidence/release
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > evidence/release/assets.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-mac-arm64.zip' --dir evidence/release
      - name: Verify and smoke test packaged startup
        run: python3 packages/macos-panel/tests/releaseSmoke.py evidence/release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-startup-${{ github.sha }}
          path: |
            evidence/release/*.json
            evidence/release/*.log
            evidence/release/*.png
          if-no-files-found: error
          retention-days: 14
